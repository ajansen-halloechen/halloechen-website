name: halloechen-website

services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_halloechen_website:/var/lib/postgresql

  # Example app service for production (uncomment when adding a Dockerfile):
  # app:
  #   build: .
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     FILES_STORAGE_PATH: /app/files
  #   volumes:
  #     - files_data_halloechen_website:/app/files
  #   depends_on:
  #     - postgres

volumes:
  postgres_data_halloechen_website:
    driver: local
