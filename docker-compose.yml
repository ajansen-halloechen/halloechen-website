name: halloechen-website

services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_halloechen_website:/var/lib/postgresql

volumes:
  postgres_data_halloechen_website:
    driver: local
