# GitLab CI/CD Pipeline
# Runs type-check, lint, and format checks in parallel.
# Build runs only after all checks pass.
# Pipeline runs only for release tags.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   FTP_HOST          e.g. ftp.example.com
#   FTP_USER          FTP username
#   FTP_PASSWORD      FTP password (mark as masked/protected)
#   FTP_REMOTE_PATH   Remote path on the server, e.g. /public_html/

stages:
  - check
  - build
  - deploy

workflow:
  rules:
    # Create pipelines only for tags (release pipelines).
    - if: '$CI_COMMIT_TAG =~ /^release_\d+\.\d+\.\d+$/'
    - when: never

# ── Shared config ────────────────────────────────────────────────────────────

default:
  image: node:22-alpine

# Force Lightning CSS to use WASM in CI to avoid native musl binary issues.
variables:
  CSS_TRANSFORMER_WASM: "1"

# Cache npm download cache across jobs for faster installs.
.npm-cache: &npm-cache
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull # jobs only read; the install step writes

# ── Install (primes the cache) ────────────────────────────────────────────────

install:
  stage: check
  <<: *npm-cache
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push # this job writes the cache
  script:
    - npm ci --prefer-offline --cache .npm
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 day

# ── Check stage (all three jobs run in parallel) ──────────────────────────────

type-check:
  stage: check
  needs:
    - job: install
      artifacts: true
  script:
    - npm run type-check

lint:
  stage: check
  needs:
    - job: install
      artifacts: true
  script:
    # Use --max-warnings 0 so any ESLint warning also fails the pipeline.
    # Do NOT use --fix here — CI must fail on issues, not silently correct them.
    - npx eslint . --max-warnings 0

format:
  stage: check
  needs:
    - job: install
      artifacts: true
  script:
    # --check exits with a non-zero code if any file is not formatted.
    - npx prettier --check --experimental-cli src/

# ── Build stage ───────────────────────────────────────────────────────────────

build:
  stage: build
  # Wait for all three checks before building.
  needs:
    - type-check
    - lint
    - format
    - job: install
      artifacts: true
  script:
    # build-only skips the redundant type-check that the full "build" script runs.
    - npm run build-only
  artifacts:
    name: dist
    paths:
      - dist/
    # Keep the artifact long enough for the deploy job to pick it up.
    expire_in: 1 day

# ── Deploy stage (release tags only) ─────────────────────────────────────────

deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - build
  # Only deploy from release tags.
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache lftp
  script:
    - |
      lftp -c "
        set ftp:ssl-allow yes;
        set ssl:verify-certificate no;
        open -u $FTP_USER,$FTP_PASSWORD $FTP_HOST;
        mirror --reverse --delete --verbose --exclude-glob .well-known/ dist/ $FTP_REMOTE_PATH;
        bye
      "
  environment:
    name: production
