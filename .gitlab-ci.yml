# GitLab CI/CD Pipeline for halloechen-website
# Stages: type-check → lint → format → build → deploy
# Runs only on release tags matching: release_X.Y.Z

stages:
  - check
  - build
  - deploy

workflow:
  rules:
    # Create pipelines only for release tags (release_X.Y.Z)
    - if: '$CI_COMMIT_TAG =~ /^release_\d+\.\d+\.\d+$/'
    - when: never

# ── Shared config ────────────────────────────────────────────────────────────

default:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull

before_script:
  - npm ci --prefer-offline --cache .npm

# ── Type Check ───────────────────────────────────────────────────────────────

type-check:
  stage: check
  script:
    - npm run type-check

# ── Lint ─────────────────────────────────────────────────────────────────────

lint:
  stage: check
  script:
    # Use --max-warnings 0 so any ESLint warning fails the pipeline.
    # Do not use --fix here; CI must fail on issues, not silently fix them.
    - npx eslint . --max-warnings 0

# ── Format ───────────────────────────────────────────────────────────────────

format:
  stage: check
  script:
    # --check exits with a non-zero code if any file is not formatted.
    - npx prettier --check --experimental-cli src/

# ── Build ────────────────────────────────────────────────────────────────────

build:
  stage: build
  needs:
    - type-check
    - lint
    - format
  script:
    - npm run build-only
  artifacts:
    name: dist
    paths:
      - dist/
    expire_in: 1 day

# ── Deploy (release tags only) ───────────────────────────────────────────────

deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - build
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache lftp
  script:
    - |
      echo "Deploying to FTP server: $FTP_HOST"
    - |
      lftp -u "$FTP_USER,$FTP_PASSWORD" "sftp://$FTP_HOST" -e "
        set cmd:fail-exit yes;
        set net:max-retries 2;
        set net:timeout 20;
        set net:reconnect-interval-base 5;
        set net:reconnect-interval-max 15;
        set sftp:auto-confirm yes;
        set xfer:log true;
        mirror --reverse --delete --verbose --exclude-glob .well-known/ dist/ $FTP_REMOTE_PATH;
        bye
      "
  environment:
    name: production
