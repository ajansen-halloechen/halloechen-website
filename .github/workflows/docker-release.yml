name: Docker Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.classify.outputs.should_build }}
      kind: ${{ steps.classify.outputs.kind }}
      tag: ${{ steps.classify.outputs.tag }}
    steps:
      - name: Classify release tag
        id: classify
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "Tag '$TAG' is not bare semver — skipping docker build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PRERELEASE=""
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(.+)$ ]]; then
            PRERELEASE="${BASH_REMATCH[1]}"
          fi

          if [[ -z "$PRERELEASE" || "$PRERELEASE" =~ ^post[0-9]+$ ]]; then
            KIND=stable
          elif [[ "$PRERELEASE" =~ ^(dev[0-9]*|a[0-9]*|rc[0-9]*)$ ]]; then
            KIND=dev
          else
            echo "Unknown pre-release identifier '$PRERELEASE' — skipping docker build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Release tag '$TAG' classified as $KIND"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        if: steps.classify.outputs.should_build == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify stable release is on main
        if: steps.classify.outputs.should_build == 'true' && steps.classify.outputs.kind == 'stable'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Stable releases must point to a commit on main"
            exit 1
          fi

  build:
    needs: validate
    if: needs.validate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.kind == 'dev' && 'dev-latest' || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME="${IMAGE_NAME##*/}"
          STATUS=$(gh api "/user/packages/container/${PACKAGE_NAME}" --jq '.visibility' 2>/dev/null || echo "unknown")
          echo "Current visibility for ${PACKAGE_NAME}: ${STATUS}"
          if [ "$STATUS" != "public" ]; then
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${PACKAGE_NAME}" \
              -f visibility='public'
            echo "Package is now public"
          else
            echo "Package is already public"
          fi
